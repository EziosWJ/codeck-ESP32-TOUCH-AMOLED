<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codeck 网络设置</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#070d17;color:#eef5ff}*{box-sizing:border-box}body{margin:0;padding:28px 18px}main{max-width:460px;margin:auto}h1{font-size:28px;margin:8px 0;color:#25d9f3}p{color:#9aa8ba;line-height:1.6}.card{background:#101b2a;border:1px solid #243b51;border-radius:20px;padding:22px;margin:20px 0}label{display:block;margin:18px 0 7px}input,select,button{font:inherit;width:100%;padding:13px;border-radius:11px;border:1px solid #34506a;background:#091321;color:#eef5ff}input:focus,select:focus{outline:2px solid #25d9f3}button{cursor:pointer;margin-top:14px;background:#25d9f3;color:#07121b;font-weight:600;border:0}button.secondary{background:#1e3348;color:#c9e7ff}button:disabled{opacity:.45;cursor:wait}.check{display:flex;align-items:center;gap:9px;color:#9aa8ba;font-size:14px}.check input{width:auto}small{color:#9aa8ba;display:block;line-height:1.5;margin-top:7px}#status{white-space:pre-wrap;line-height:1.6;color:#25d9f3}#error{color:#ffae83;line-height:1.5}hr{border:0;border-top:1px solid #243b51;margin-top:24px}[hidden]{display:none!important}
</style></head><body><main><h1>Codeck 网络设置</h1><p>连接新的 Wi-Fi，并设置额度服务。配置保存后，重启会自动连接。</p>
<form id="form" class="card"><label for="networks">附近的 Wi-Fi</label><select id="networks"><option value="">选择网络或手动填写</option></select><button type="button" id="scan" class="secondary">扫描网络</button>
<label for="ssid">Wi-Fi 名称</label><input id="ssid" autocomplete="off" required><small>支持手动输入隐藏网络，使用 2.4 GHz Wi-Fi。</small>
<label for="wifi_password">Wi-Fi 密码</label><input id="wifi_password" type="password" autocomplete="new-password"><label class="check" id="keep_wifi_row" hidden><input type="checkbox" id="keep_wifi_password">保留已保存的 Wi-Fi 密码</label><small>开放网络可留空；普通密码为 8–63 字节。</small>
<hr><label for="api_url">API 地址</label><input id="api_url" type="url" required placeholder="https://example.com/api/account"><label for="api_username">API 用户名</label><input id="api_username" autocomplete="username" required>
<label for="api_password">API 密码</label><input id="api_password" type="password" autocomplete="new-password"><label class="check" id="keep_api_row" hidden><input type="checkbox" id="keep_api_password">保留已保存的 API 密码</label><small>HTTPS 会校验证书，需要设备先同步时间。</small>
<button id="submit" type="submit">连接并保存</button><div id="error" role="alert"></div></form>
<div class="card"><div id="status" role="status">等待配置</div><button id="finish" hidden>完成并关闭热点</button><small>取消配网请使用设备第三页的按钮。连接测试期间手机可能短暂掉线，请保持连接 Codeck 热点。</small></div></main>
<script>
const $ = id => document.getElementById(id);
let token = '', ready = false, busy = true, submitted = false;
let finishing = false, scanning = false, sending = false, processing = false, mutationEpoch = 0;
async function api(path, method = 'GET', data) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
        const response = await fetch('/api/' + path, {
            method, cache: 'no-store', signal: controller.signal,
            headers: {'Content-Type': 'application/json', 'X-Codeck-Token': token},
            body: data === undefined ? undefined : JSON.stringify(data)
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.error || '请求失败');
        return result;
    } catch (error) {
        if (error.name === 'AbortError') throw Error('请求超时，请保持连接 Codeck 热点后重试');
        throw error;
    } finally { clearTimeout(timeout); }
}
function refreshControls() {
    busy = !ready || scanning || sending || processing || finishing;
    for (const id of ['submit', 'scan', 'networks', 'ssid', 'api_url', 'api_username',
                       'keep_wifi_password', 'keep_api_password']) $(id).disabled = busy;
    for (const kind of ['wifi', 'api']) {
        $(kind + '_password').disabled = busy || $('keep_' + kind + '_password').checked;
    }
    $('finish').disabled = busy;
}
function applyPasswords(config, clear) {
    for (const kind of ['wifi', 'api']) {
        const has = config['has_' + kind + '_password'];
        $('keep_' + kind + '_row').hidden = !has;
        if (clear) {
            $(kind + '_password').value = '';
            $('keep_' + kind + '_password').checked = has;
        }
    }
}
async function load() {
    refreshControls();
    try {
        const config = await api('config');
        token = config.token;
        for (const id of ['ssid', 'api_url', 'api_username']) $(id).value = config[id];
        applyPasswords(config, true);
        ready = true;
        await poll();
    } catch (error) { $('error').textContent = '无法读取配置，请刷新页面。'; }
}
for (const kind of ['wifi', 'api']) $('keep_' + kind + '_password').onchange = refreshControls;
function changeNetwork(ssid) {
    if (ssid !== undefined) $('ssid').value = ssid;
    $('keep_wifi_password').checked = false;
    refreshControls();
}
$('networks').onchange = () => { if ($('networks').value) changeNetwork($('networks').value); };
$('ssid').oninput = () => changeNetwork();
$('scan').onclick = async () => {
    if (busy) return;
    scanning = true; refreshControls(); $('error').textContent = '';
    try {
        const networks = await api('scan');
        $('networks').replaceChildren(new Option('选择网络或手动填写', ''));
        const seen = new Set();
        for (const network of networks) {
            if (seen.has(network.ssid)) continue;
            seen.add(network.ssid);
            $('networks').add(new Option(network.ssid + ' · ' + network.rssi + ' dBm' +
                (network.secure ? '' : ' · 开放'), network.ssid));
        }
    } catch (error) { $('error').textContent = error.message; }
    finally { scanning = false; refreshControls(); }
};
$('form').onsubmit = async event => {
    event.preventDefault();
    if (busy) return;
    const config = {};
    for (const id of ['ssid', 'wifi_password', 'api_url', 'api_username', 'api_password']) config[id] = $(id).value;
    for (const id of ['keep_wifi_password', 'keep_api_password']) config[id] = $(id).checked;
    const bytes = value => new TextEncoder().encode(value).length;
    if (bytes(config.ssid) > 32 || bytes(config.wifi_password) > 64 || bytes(config.api_url) > 256 ||
        bytes(config.api_username) > 128 || bytes(config.api_password) > 128) {
        $('error').textContent = '输入内容过长，请缩短后重试。'; return;
    }
    if (!config.keep_api_password && !config.api_password) {
        $('error').textContent = '请填写 API 密码。'; return;
    }
    sending = true; submitted = true; mutationEpoch++; refreshControls();
    $('error').textContent = ''; $('status').textContent = '正在提交配置…'; $('finish').hidden = true;
    try { await api('config', 'POST', config); processing = true; }
    catch (error) { submitted = false; $('error').textContent = error.message; }
    finally { sending = false; mutationEpoch++; refreshControls(); }
};
async function poll() {
    if (finishing) return;
    const epoch = mutationEpoch;
    try {
        const status = await api('status');
        if (epoch !== mutationEpoch || sending) return;
        $('status').textContent = status.message + (status.saved ? '\n配置已保存到设备' : '');
        processing = status.phase === 2 || status.phase === 3 || status.phase === 6;
        $('finish').hidden = !(status.saved && status.phase === 4);
        if (!processing && !sending && submitted) {
            const config = await api('config');
            applyPasswords(config, status.saved);
            submitted = false;
        }
    } catch (error) { $('status').textContent = '等待设备响应；请保持连接 Codeck 热点。'; }
    finally { refreshControls(); if (!finishing) setTimeout(poll, 1500); }
}
$('finish').onclick = async () => {
    if (busy) return;
    sending = true; mutationEpoch++; refreshControls();
    try {
        await api('finish', 'POST', {});
        finishing = true; $('finish').hidden = true;
        $('status').textContent = '配置完成，热点即将关闭。可以切回日常 Wi-Fi。';
    } catch (error) { $('error').textContent = error.message; }
    finally { sending = false; mutationEpoch++; refreshControls(); }
};
load();
</script></body></html>
